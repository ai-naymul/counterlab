name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  no-api-key:
    # The whole point: the suite runs with NO model credentials and NO network
    # access to any provider. If it ever needs a key, the deterministic layer
    # is not real and this job should fail.
    name: 95 tests, no API key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Confirm no credentials are present
        run: |
          test -z "${GEMINI_API_KEY:-}" || { echo "GEMINI_API_KEY is set; this job is meaningless"; exit 1; }
          echo "GEMINI_API_KEY is unset"

      - name: Run the suite
        env:
          GEMINI_API_KEY: ''
        run: pytest -q

      - name: Prove rules.py never reaches the network
        run: |
          ! grep -nE 'httpx|requests|urllib|socket|aiohttp' app/rules.py
          echo "rules.py imports no networking library"
