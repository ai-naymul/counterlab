      - listitem [ref=f9e29]: Show the original idea to a science teacher. They can usually suggest a safe version you wouldn't have thought of.
      - listitem [ref=f9e30]: If this is for a science fair, there's almost certainly a safety review form. Fill it in early, not the week before.
