      - text: Why this one stops here
    - paragraph [ref=f9e16]: This plan involves judging whether treated water is safe to drink. Water can look completely clear and still carry bacteria, viruses, and dissolved contaminants that cause serious illness. Clarity is not safety, and no home filter test can establish that water is potable.
    - paragraph [ref=f9e17]: CounterLab won't help design this version and won't give you a procedure for it. That isn't a judgement about you. No result from this experiment would be worth the cost of getting it wrong.
  - generic [ref=f9e18]:
    - heading "→ Do this instead" [level=2] [ref=f9e19]:
      - generic [ref=f9e20]: →
      - text: Do this instead
    - paragraph [ref=f9e21]: Keeps the interesting part of your question. Drops the dangerous part.
    - paragraph [ref=f9e22]: Test turbidity only, and never drink any of it. Make your own muddy water from clean tap water and garden soil, pour a fixed volume through each filter, and measure how clear the output is - either by timing how long a light takes to become visible through a fixed depth, or by photographing each sample against a printed grid and comparing. You are measuring clarity, and you say so on your board.
    - link "Rewrite my plan and check it again" [ref=f9e24] [cursor=pointer]:
