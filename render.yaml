# Web service only. Render Workflows are NOT Blueprint-compatible and must be
# created as a separate "Workflow" service in the dashboard.
services:
  - type: web
    name: counterlab
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: COUNTERLAB_CONTACT_EMAIL
        sync: false
